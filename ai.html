<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vyapar AI</title>
  <style>
    body {
      background: #111;
      color: white;
      text-align: center;
      font-family: Arial;
      padding-top: 50px;
    }
    textarea {
      width: 80%;
      height: 120px;
      font-size: 18px;
      padding: 10px;
    }
    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
    }
    #response {
      margin-top: 30px;
      background: #222;
      padding: 15px;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
      border-radius: 8px;
      min-height: 50px;
      text-align: left;
    }
  </style>
</head>
<body>

<h1>🤖 Vyapar AI</h1>

<textarea id="question" placeholder="এখানে প্রশ্ন লেখো..."></textarea><br>
<button onclick="askAI()">Ask AI</button>

<div id="response">উত্তর এখানে দেখাবে...</div>

<script>
async function askAI() {
  const q = document.getElementById("question").value;
  document.getElementById("response").innerText = "লোড হচ্ছে...";

  const res = await fetch("https://business-ai-app.onrender.com/ai/ask", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ question: q })
  });

  const data = await res.json();
  document.getElementById("response").innerText = data.answer || JSON.stringify(data);
}
</script>

</body>
</html>
