<!DOCTYPE html>
<html>
<head>
  <title>Vyapar AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="font-family:Arial; background:#111; color:white; text-align:center; padding:20px">

  <h1>🤖 Vyapar AI</h1>

  <textarea id="q" placeholder="এখানে প্রশ্ন লেখো..."
    style="width:90%; height:100px; font-size:16px"></textarea><br><br>

  <button onclick="askAI()" style="padding:10px 20px;font-size:18px">
    Ask AI
  </button>

  <pre id="ans" style="text-align:left; white-space:pre-wrap; margin-top:20px"></pre>

  <script>
    async function askAI() {
      let q = document.getElementById("q").value;
      let res = await fetch("https://business-ai-app.onrender.com/ai/ask", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({question:q})
      });
      let data = await res.json();
      document.getElementById("ans").innerText = data.answer || JSON.stringify(data);
    }
  </script>

</body>
</html>
