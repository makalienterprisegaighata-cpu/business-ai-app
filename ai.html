<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Vyapar AI</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 50px;
    }
    textarea {
      width: 80%;
      height: 120px;
      font-size: 18px;
      padding: 10px;
    }
    button {
      margin-top: 15px;
      padding: 10px 25px;
      font-size: 18px;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      background: #222;
      padding: 15px;
      border-radius: 5px;
      width: 80%;
      margin-left: auto;
      margin-right: auto;
      min-height: 50px;
    }
  </style>
</head>
<body>

<h1>🤖 Vyapar AI</h1>

<textarea id="question" placeholder="এখানে প্রশ্ন লিখো..."></textarea><br>
<button onclick="askAI()">Ask AI</button>

<div id="result">উত্তর এখানে আসবে...</div>

<script>
async function askAI() {
  const q = document.getElementById("question").value;
  const resultBox = document.getElementById("result");

  resultBox.innerText = "লোড হচ্ছে... ⏳";

  try {
    const res = await fetch("https://business-ai-app.onrender.com/ai/ask", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: q
      })
    });

    const data = await res.json();
    resultBox.innerText = data.answer || "কোনো উত্তর আসেনি 😢";
  } catch (err) {
    resultBox.innerText = "এরর হয়েছে: " + err;
  }
}
</script>

</body>
</html>
