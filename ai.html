<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>Vyapar AI</title>
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 30px;
    }
    textarea {
      width: 90%;
      height: 120px;
      font-size: 18px;
      border-radius: 10px;
      padding: 10px;
    }
    button {
      font-size: 18px;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 10px;
    }
    #response {
      margin-top: 20px;
      background: #222;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>🤖 Vyapar AI</h1>

  <textarea id="question" placeholder="এখানে প্রশ্ন বলো বা লেখো..."></textarea><br>

  <button onclick="startVoice()">🎤 Speak</button>
  <button onclick="askAI()">Ask AI</button>

  <div id="response"></div>

  <script src="script.js"></script>
</body>
</html>
