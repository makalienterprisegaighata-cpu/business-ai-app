<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Vyapar AI</title>
<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 20px;
}
h1 { color: #38bdf8; }
input, button {
  padding: 10px;
  font-size: 16px;
  margin: 5px;
  width: 80%;
  border-radius: 8px;
  border: none;
}
button {
  background: #22c55e;
  color: black;
  font-weight: bold;
}
#answer {
  margin-top: 20px;
  font-size: 18px;
  color: #facc15;
}
</style>
</head>
<body>

<h1>🤖 Vyapar AI</h1>
<p>লিখে বা বলে প্রশ্ন করো</p>

<input id="question" placeholder="এখানে প্রশ্ন লেখো..." />
<br>
<button onclick="askAI()">Send</button>
<br>
<button onclick="startVoice()">🎤 Voice</button>

<div id="answer"></div>

<script>
const API_URL = "https://business-ai-app.onrender.com/ai/ask";

function askAI() {
  const q = document.getElementById("question").value;
  document.getElementById("answer").innerText = "⏳ ভাবছি...";

  fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ question: q })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("answer").innerText = data.answer;
    speak(data.answer);
  })
  .catch(err => {
    document.getElementById("answer").innerText = "❌ Error: API connect হয়নি";
  });
}

// Voice input
function startVoice() {
  const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  rec.lang = "bn-BD";
  rec.start();

  rec.onresult = function(e) {
    const text = e.results[0][0].transcript;
    document.getElementById("question").value = text;
    askAI();
  };
}

// Voice output
function speak(text) {
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = "bn-BD";
  speechSynthesis.speak(msg);
}
</script>

</body>
</html>
