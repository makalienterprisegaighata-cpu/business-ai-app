<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Vyapar AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    header {
      background: #020617;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      padding: 20px;
    }

    input {
      width: 90%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
    }

    button {
      width: 90%;
      padding: 12px;
      margin: 6px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #22c55e;
      color: black;
      font-weight: bold;
    }

    #response {
      margin-top: 20px;
      background: #020617;
      padding: 15px;
      border-radius: 10px;
      min-height: 80px;
    }

    .error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  🤖 Vyapar AI  
  <div style="font-size:14px;">লিখে বা বলে প্রশ্ন করো</div>
</header>

<div class="container">

  <input id="question" placeholder="আজ আমার দোকানের বিক্রি কেমন?" />

  <br>

  <button onclick="sendText()">Send</button>
  <button onclick="startVoice()">🎤 Voice</button>

  <div id="response"></div>
  <div id="error" class="error"></div>

</div>

<script>
  // 🔥 এখানে তোমার আসল Render URL বসানো
  const API_URL = "https://business-ai-app.onrender.com/ai/ask";

  async function sendText() {
    const q = document.getElementById("question").value;
    if (!q) return;

    document.getElementById("response").innerText = "⏳ ভাবছি...";
    document.getElementById("error").innerText = "";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ question: q })
      });

      const data = await res.json();
      document.getElementById("response").innerText = data.answer || JSON.stringify(data);

      speak(data.answer);

    } catch (e) {
      document.getElementById("error").innerText = "❌ API connect হয়নি";
    }
  }

  // Voice Input
  function startVoice() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "bn-IN";

    recognition.onresult = function(event) {
      const text = event.results[0][0].transcript;
      document.getElementById("question").value = text;
      sendText();
    };

    recognition.start();
  }

  // Voice Output
  function speak(text) {
    if (!text) return;
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = "bn-IN";
    speechSynthesis.speak(msg);
  }
</script>

</body>
</html>
